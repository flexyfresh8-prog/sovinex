appId: com.sonivex.studio
productName: Sonivex Studio
copyright: Copyright © 2026 Sonivex Engineering
directories:
  output: release
  buildResources: build
afterPack: ./scripts/patch-win-exe.mjs
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/node_modules/**"
electronLanguages:
  - en-US
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext: svx
      name: Sonivex Project
      description: Sonivex Studio Project File
nsis:
  script: build/nsis-templates/installer.nsi
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sonivex Studio
  uninstallDisplayName: Sonivex Studio
  deleteAppDataOnUninstall: false
  artifactName: Sonivex-Studio-Setup-${version}.${ext}
portable:
  artifactName: Sonivex-Studio-Portable-${version}.${ext}
publish: null
