<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="description" content="SONIVEX live subwoofer — drop in an MP3, shape it with the EQ, and watch the cone move. Fully procedural driver, rendered in your browser.">
<meta property="og:title" content="SONIVEX — Live Subwoofer">
<meta property="og:description" content="Import your music, run it through the EQ, and watch a fully procedural subwoofer move with the bass.">
<meta property="og:image" content="assets/icon.png">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<title>SONIVEX — Live Subwoofer</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","three/examples/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/"}}
</script>
<style>
:root{
  --bg:#050506; --glass:rgba(12,12,14,.78); --glass-2:rgba(18,18,21,.9);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --txt:#ececec; --txt-1:#9c9ca4; --txt-2:#5b5b64;
  --accent:#e8e8ec; --gold:#d8b25e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --dock-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:var(--font)}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 90% at 50% 42%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---------- corner chrome ---------- */
.brand{position:fixed;top:14px;left:18px;z-index:10;display:flex;align-items:baseline;gap:10px;user-select:none}
.brand b{font-size:13px;letter-spacing:.42em;font-weight:700;color:var(--txt)}
.brand span{font-size:10px;letter-spacing:.18em;color:var(--txt-2);text-transform:uppercase}
.corner-link{position:fixed;top:14px;right:18px;z-index:10;font-size:11px;letter-spacing:.14em;
  color:var(--txt-2);text-decoration:none;text-transform:uppercase;padding:6px 8px;border-radius:8px}
.corner-link:hover{color:var(--txt-1);background:rgba(255,255,255,.05)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:18px;
  align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s}
#loader.done{opacity:0;pointer-events:none}
#loader b{font-size:12px;letter-spacing:.5em;color:var(--txt-1);font-weight:600}
.spin{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.12);
  border-top-color:#bbb;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  width:min(94vw,760px)}
.btn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;min-width:42px;
  padding:0 12px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--txt-1);
  cursor:pointer;transition:all .18s;font-family:var(--font);font-size:12px;letter-spacing:.06em}
.btn svg{width:17px;height:17px;fill:currentColor;flex:0 0 auto}
.btn:hover{color:var(--txt);background:rgba(255,255,255,.06);border-color:var(--line)}
.btn.on{color:#0a0a0b;background:var(--accent);border-color:var(--accent)}
.btn.gold.on{background:var(--gold);border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:transparent;border-color:transparent;color:var(--txt-1)}
#playBtn{background:var(--accent);color:#0a0a0b;border-color:var(--accent);width:48px;height:48px;border-radius:15px}
#playBtn:hover{background:#fff;border-color:#fff;color:#0a0a0b}
#playBtn:disabled{background:rgba(255,255,255,.12);color:var(--txt-2)}
.seek-wrap{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;min-width:80px;padding:0 2px}
#seekBar{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#seekTrack{position:relative;width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
#seekFill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:3px;background:var(--accent)}
#seekTrack .knob{position:absolute;top:50%;left:0%;width:11px;height:11px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .15s}
#seekBar:hover .knob{opacity:1}
.time-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--txt-2)}
#trackName{font-size:11px;color:var(--txt-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:34vw;letter-spacing:.02em}
#trackName em{font-style:normal;color:var(--txt-2)}
.exc{font-family:var(--mono);font-size:10px;color:var(--txt-2);text-align:right;line-height:1.5;
  flex:0 0 auto;min-width:74px}
.exc b{color:var(--txt-1);font-weight:600}
@media (max-width:640px){
  #trackName{display:none}
  .exc{display:none}
  #dock{gap:6px;padding:8px 10px}
}

/* ---------- EQ panel ---------- */
#eqPanel{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);z-index:19;
  bottom:calc(86px + env(safe-area-inset-bottom));width:min(94vw,760px);
  background:var(--glass-2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .22s ease}
#eqPanel.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.eq-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.eq-head b{font-size:11px;letter-spacing:.34em;color:var(--txt-1);font-weight:600}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;
  color:var(--txt-1);font-size:10px;letter-spacing:.08em;cursor:pointer;transition:all .15s;font-family:var(--font)}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.on{color:#0a0a0b;background:var(--accent);border-color:var(--accent);font-weight:600}
#eqBands{display:flex;justify-content:space-between;gap:4px;padding:2px 2px 0}
.band{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.band .val{font-family:var(--mono);font-size:9px;color:var(--txt-2);height:12px}
.band .val.hot{color:var(--gold)}
.fader{position:relative;width:26px;height:118px;cursor:pointer;touch-action:none;outline:none}
.fader:focus-visible{border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.fader .rail{position:absolute;left:50%;top:0;bottom:0;width:4px;transform:translateX(-50%);
  border-radius:3px;background:rgba(255,255,255,.1)}
.fader .fill{position:absolute;left:50%;width:4px;transform:translateX(-50%);border-radius:3px;background:var(--accent)}
.fader .thumb{position:absolute;left:50%;width:24px;height:11px;border-radius:6px;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#fdfdfd,#c9c9cf);box-shadow:0 2px 8px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center}
.fader .thumb::after{content:"";width:14px;height:1.5px;background:rgba(0,0,0,.55);border-radius:2px}
.band .hz{font-family:var(--mono);font-size:9px;color:var(--txt-2)}
.motion-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.motion-row label{font-size:10px;letter-spacing:.18em;color:var(--txt-2)}
#motionBar{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#motionTrack{position:relative;width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12)}
#motionFill{position:absolute;inset:0 auto 0 0;width:66%;border-radius:3px;background:var(--gold)}
#motionVal{font-family:var(--mono);font-size:10px;color:var(--txt-1);min-width:38px;text-align:right}

/* ---------- drop overlay / toast ---------- */
#drop{position:fixed;inset:10px;z-index:40;border:2px dashed rgba(255,255,255,.35);border-radius:24px;
  background:rgba(5,5,6,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;pointer-events:none}
#drop.on{display:flex}
#drop b{font-size:15px;letter-spacing:.24em;color:var(--txt)}
#drop span{font-size:11px;letter-spacing:.14em;color:var(--txt-1)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(92px + env(safe-area-inset-bottom));
  z-index:45;background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:9px 16px;
  font-size:12px;color:var(--txt);opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#err{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;
  background:var(--bg);color:var(--txt-1);font-size:13px;text-align:center;line-height:1.7}
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>

<div class="brand"><b>SONIVEX</b><span>live subwoofer</span></div>
<a class="corner-link" href="./studio.html" title="Full studio site">Studio&nbsp;↗</a>

<div id="loader"><div class="spin"></div><b>SONIVEX</b></div>
<div id="err"></div>

<div id="eqPanel">
  <div class="eq-head">
    <b>EQUALIZER</b>
    <div class="presets" id="presets"></div>
  </div>
  <div id="eqBands"></div>
  <div class="motion-row">
    <label>MOTION</label>
    <div id="motionBar"><div id="motionTrack"><div id="motionFill"></div></div></div>
    <span id="motionVal">100%</span>
  </div>
</div>

<div id="dock">
  <button class="btn" id="importBtn" title="Import audio file (MP3 / WAV / OGG / FLAC)">
    <svg viewBox="0 0 24 24"><path d="M12 3 5.5 9.5h4v6.5h5V9.5h4L12 3zm-7 15v3h14v-3H5z"/></svg>
    <span>Import</span>
  </button>
  <button class="btn" id="demoBtn" title="Built-in bass demo loop">
    <svg viewBox="0 0 24 24"><path d="M3 12h2l2-7 3 14 3-10 2 5 2-3h4v2h-3l-3 5-2-5-3 9-3-13-1.5 3H3v-2z"/></svg>
    <span>Demo</span>
  </button>
  <button class="btn" id="playBtn" disabled title="Play / pause (Space)">
    <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
    <svg id="icoPause" viewBox="0 0 24 24" style="display:none"><path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z"/></svg>
  </button>
  <div class="seek-wrap">
    <div class="time-row"><span id="trackName"><em>no track — import an mp3 or hit Demo</em></span><span id="timeNow">0:00</span></div>
    <div id="seekBar"><div id="seekTrack"><div id="seekFill"></div><div class="knob"></div></div></div>
    <div class="time-row"><span>&nbsp;</span><span id="timeTot">0:00</span></div>
  </div>
  <div class="exc">exc<br><b id="excVal">0.0</b> mm</div>
  <button class="btn" id="loopBtn" title="Loop" disabled>
    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
  </button>
  <button class="btn" id="eqBtn" title="Equalizer">
    <svg viewBox="0 0 24 24"><path d="M5 20v-9H3v9h2zm0-13V4H3v3h2zm4 13v-5H7v5h2zm0-9V4H7v7h2zm4 9v-3h-2v3h2zm0-7V4h-2v9h2zm4 7v-7h-2v7h2zm0-11V4h-2v5h2zm4 11v-5h-2v5h2zm0-9V4h-2v7h2z"/></svg>
    <span>EQ</span>
  </button>
  <button class="btn" id="muteBtn" title="Mute">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3 3-3-1.4-1.4-3 3-3-3L10.7 9l3 3-3 3 1.4 1.4 3-3 3 3 1.4-1.4-3-3z"/></svg>
  </button>
</div>

<div id="drop"><b>DROP AUDIO</b><span>mp3 · wav · ogg · flac</span></div>
<div id="toast"></div>
<input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a" hidden>

<script type="module" src="./experience.js"></script>
</body>
</html>
